[project]
name = "twin-template"
version = "0.1.0"
description = "A template that anyone can use to build their digital twin step by step."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openai>=1.0.0",
    "gradio>=4.0.0",
    "requests>=2.28.0",
    "dotenv>=0.9.9",
    "google-genai>=2.18.1",
    "chromadb>=1.5.9",
    "google-cloud-storage>=2.18.0",
]

[tool.uv.workspace]
members = [
    "chunking",
]
