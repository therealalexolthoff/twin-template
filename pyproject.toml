[project]
name = "twin-template"
version = "0.1.0"
description = "A template that anyone can use to build their digital twin step by step."
readme = "README.md"
requires-python = ">=3.14"
# Used by both pipelines (ingest and serve).
dependencies = [
    "dotenv>=0.9.9",
    "google-genai>=2.18.1",
    "chromadb>=1.5.9",
    "google-cloud-storage>=2.18.0",
]

[dependency-groups]
# Only needed by the chatbot service. Dockerfile.serve installs this group;
# Dockerfile.ingest skips it so the ingest image stays smaller.
serve = [
    "gradio>=6.0.0",
    "requests>=2.28.0",
    "google-cloud-modelarmor>=0.7.2",
]

[tool.uv]
# Locally, `uv run run_app.py` should just work, so install the serve group by default.
default-groups = ["serve"]
